[files]
# The Vietnamese locale files are not English: an English spell checker has nothing to say about them.
extend-exclude = ["pnpm-lock.yaml", "Cargo.lock", ".backlog/config.yml", "apps/desktop/src/shared/i18n/locales/vi*.json", "apps/desktop/src/**/*Vietnamese*.test.tsx"]

[default.extend-identifiers]
# Win32 IFileOperation flag names (FOF_* / FOFX_*), used by volt-win.
FOF_ALLOWUNDO = "FOF_ALLOWUNDO"
FOF_NOCONFIRMATION = "FOF_NOCONFIRMATION"
FOF_NOERRORUI = "FOF_NOERRORUI"
FOF_SILENT = "FOF_SILENT"

[default]
# SDDL ACE trustee aliases (BA = built-in Administrators), used in the helper pipe security descriptor.
extend-ignore-re = ['\(A;;[0-9A-Za-z]+;;;BA\)']
