# ==== Performance ==========================================================================

[[tweak]]
id = "faster-menu-display"
title = "Show menus without a delay"
description = "Sub-menus open as soon as you point at them instead of after a short wait (400 ms by default). Menus feel quicker; if they open too eagerly while you move the mouse, undo it. Sign out and back in for it to apply."
category = "performance"
risk = "safe"
evidence = "anecdotal"
evidence_note = "MenuShowDelay is the documented delay in milliseconds before a menu opens. Perceived speed only; nothing runs faster."
restart = "sign_out"

[[tweak.steps]]
kind = "registry_set"
hive = "HKCU"
subkey = 'Control Panel\Desktop'
name = "MenuShowDelay"
value = { sz = "0" }

[[tweak]]
id = "end-hung-apps-faster"
title = "Close unresponsive apps sooner at sign-out"
description = "When you sign out or shut down, Windows waits 5 seconds for each app that does not respond before ending it. This shortens both waits to 3 seconds. Shutdown is quicker with a stuck app, but an app that is slow to save its work may be ended before it finishes. Sign out and back in for it to apply."
category = "performance"
risk = "caution"
evidence = "anecdotal"
evidence_note = "HungAppTimeout and WaitToKillAppTimeout are documented timeouts in milliseconds. The gain only shows when an app hangs while you sign out."
restart = "sign_out"

[[tweak.steps]]
kind = "registry_set"
hive = "HKCU"
subkey = 'Control Panel\Desktop'
name = "HungAppTimeout"
value = { sz = "3000" }

[[tweak.steps]]
kind = "registry_set"
hive = "HKCU"
subkey = 'Control Panel\Desktop'
name = "WaitToKillAppTimeout"
value = { sz = "3000" }

[[tweak]]
id = "turn-off-game-recording"
title = "Turn off background game recording"
description = "Stops Windows from continuously recording gameplay in the background so you can save the last few minutes afterwards. This frees a little graphics and disk activity while you play. You can no longer save a clip of something that already happened; recording a clip on purpose still works."
category = "performance"
risk = "safe"
evidence = "anecdotal"
evidence_note = "The Record what happened option in Settings, Gaming, Captures. The cost of background capture is small and varies by game and hardware."
restart = "none"

[[tweak.steps]]
kind = "registry_set"
hive = "HKCU"
subkey = 'Software\Microsoft\Windows\CurrentVersion\GameDVR'
name = "HistoricalCaptureEnabled"
value = { dword = 0 }

[[tweak]]
id = "stop-edge-background-start"
title = "Stop Microsoft Edge from running in the background"
description = "Edge no longer preloads itself at sign-in (Startup boost) and no longer keeps running after you close its last window. This frees some memory and start-up work; Edge may open a little slower. Edge shows a Managed by your organization notice because this is set as a browser policy. Restart Edge to apply it."
category = "performance"
risk = "caution"
evidence = "anecdotal"
evidence_note = "StartupBoostEnabled and BackgroundModeEnabled are documented Microsoft Edge policies. The memory saved depends on how you use Edge."
restart = "none"
requires_admin = true

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SOFTWARE\Policies\Microsoft\Edge'
name = "StartupBoostEnabled"
value = { dword = 0 }

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SOFTWARE\Policies\Microsoft\Edge'
name = "BackgroundModeEnabled"
value = { dword = 0 }

[[tweak]]
id = "turn-off-search-indexing"
title = "Turn off Windows Search indexing"
description = "Stops the indexer that scans your files in the background, which means less disk and processor activity. Searching from Start and File Explorer becomes slower, and results can miss files, because there is no index to look in. Restart your PC for it to apply."
category = "performance"
risk = "caution"
evidence = "anecdotal"
evidence_note = "Disabling the Windows Search service (WSearch) is documented. The saving is largest on slow disks, and you pay for it with slower searches."
restart = "reboot"
requires_admin = true

[[tweak.steps]]
kind = "service"
service = "WSearch"
start_type = "disabled"

[[tweak]]
id = "turn-off-fast-startup"
title = "Turn off Fast startup"
description = "Shutdown becomes a full shutdown instead of a hybrid of shutdown and hibernation. Start-up can be a little slower on some PCs, but drivers and services start fresh every time, which helps when a PC misbehaves after shutting down or when you dual-boot. Applies at the next shutdown."
category = "performance"
risk = "caution"
evidence = "anecdotal"
evidence_note = "HiberbootEnabled is the documented switch behind the Turn on fast startup option in Power Options. Whether start-up gets faster or slower depends on the PC."
restart = "reboot"
requires_admin = true

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SYSTEM\CurrentControlSet\Control\Session Manager\Power'
name = "HiberbootEnabled"
value = { dword = 0 }

[[tweak]]
id = "stop-sharing-updates-with-other-pcs"
title = "Stop sharing downloaded updates with other PCs"
description = "Windows keeps downloading its updates from Microsoft, but stops sending the pieces it already has to other PCs on the internet or your network. This saves upload bandwidth and a little background activity. Updates are not delayed or disabled."
category = "performance"
risk = "safe"
evidence = "anecdotal"
evidence_note = "DODownloadMode 0 is a documented Delivery Optimization policy (HTTP only, no peering). The saving depends on how often your PC shares updates."
restart = "none"
requires_admin = true

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
name = "DODownloadMode"
value = { dword = 0 }

