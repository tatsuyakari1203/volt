# The tweak catalogue embedded in the desktop app (apps/desktop/src-tauri/src/catalogue.rs).
#
# The format is documented on `volt_core::Catalogue::from_toml`; the app refuses to start the
# tweak engine when this file does not validate, and tests check it on every build. A test also
# runs every tweak here against the in-memory fakes (detect, apply, revert, exact previous state
# back), so a tweak whose revert does not restore what it changed cannot be released.
#
# Rules for adding a tweak:
#   - Its effect must be explainable and documented by Microsoft or widely verified. No folklore.
#   - It never weakens security (Defender, UAC, SmartScreen, Windows Update, the firewall) and it
#     never deletes anything.
#   - `evidence` is "measured" only when Volt itself measured the effect. Nothing here is, so every
#     tweak says "anecdotal" and the note says where the claim comes from.
#   - A per-user setting (HKCU) works for any user. A machine-wide setting, a service or a command
#     needs `requires_admin = true`: the engine then refuses it before touching anything.
#   - `restart` says what is needed before the change is complete: "sign_out", "reboot" or, by
#     default, nothing.
#
# The sections are Appearance, Performance and Privacy, in that order.

# ==== Appearance ===========================================================================

[[tweak]]
id = "show-file-extensions"
title = "Show file extensions"
description = "Always show file endings such as .exe and .pdf in File Explorer, so a program disguised as a document is easier to spot."
category = "appearance"
risk = "safe"
evidence = "anecdotal"
evidence_note = "A usability and safety preference, not a performance gain: nothing gets faster. Open File Explorer windows pick the change up when they are refreshed."
restart = "none"

[[tweak.steps]]
kind = "registry_set"
hive = "HKCU"
subkey = 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "HideFileExt"
value = { dword = 0 }

[[tweak]]
id = "show-hidden-files"
