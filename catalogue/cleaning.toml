[[rule]]
id = "vivaldi-cache"
title = "Vivaldi cache"
description = """
Copies of web pages, pictures and scripts that Vivaldi saved in each of its profiles so that sites load faster, plus the compiled code and graphics caches it builds from them. Only those cache folders are taken: cookies, history, saved passwords, bookmarks, open tabs, extensions and site data are never touched, so you stay signed in. Files modified in the last day are kept, and files Vivaldi has open while it runs are skipped. Sites load a little slower the first time afterwards while the cache fills again."""
category = "browser_cache"
risk = "safe"
include = [
    "*/Cache/**",
