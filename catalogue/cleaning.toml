# The cleaning rules embedded in the desktop app (apps/desktop/src-tauri/src/catalogue.rs).
#
# Every rule says exactly where it looks, what it may take and what it must leave alone. The format
# is documented on `volt_core::CleaningRules::from_toml`; the app refuses to start when this file
# does not validate, and a test checks it on every build. A test also builds a fixture tree for
# EVERY rule here (apps/desktop/src-tauri/tests/cleaning_rules.rs) and fails when a rule has none.
#
# Everything a clean takes goes to the Recycle Bin, never to a permanent delete. Entries modified
# more recently than `min_age_days` are never taken. A rule marked `requires_admin = true` sits in a
# machine-wide location that Windows only lets an administrator read or change; run unelevated,
# its scan reports that in a typed way instead of an empty result.
#
# Left out on purpose (see the task notes): the Windows Update download cache (clearing it needs the
# update service stopped and started again, which needs administrator rights) and emptying the
# Recycle Bin (a permanent delete, a separate explicit action). When in doubt a location is left
# out: a small, obviously safe set beats a large one.
#
# Per-user locations first (no administrator rights), then the machine-wide ones.

# ---- per user ----------------------------------------------------------------------------------

[[rule]]
id = "user-temp"
title = "Temporary files"
description = """
Files that programs and installers left in your temporary folder (%TEMP%) and no longer use. Only files and \
folders not modified for at least the minimum age are taken (7 days unless you change it in the settings, the \
same age Windows' own Disk Cleanup uses), so what a program is working with right now is never touched, and a \
file another program still holds open is skipped. Folders that end up empty are taken too. You will not \
notice anything: programs create their temporary files again when they need them."""
category = "temporary_files"
risk = "safe"
include = ["**"]
min_age_setting = "clean.temp_min_age_days"

[rule.root]
location = "user_temp"

[rule.constraints]
min_age_days = 7
max_depth = 6
remove_empty_dirs = true

[[rule]]
id = "user-wer-archive"
title = "Error reports already handled"
description = """
Windows Error Reporting keeps a copy of every error report it has dealt with in your profile, one folder per \
report, with the crash details and sometimes a small memory snapshot. They are only for diagnosis: nothing \
reads them again unless you open one yourself. Reports newer than 7 days are kept. You will not notice \
anything, except that an old report you wanted to look at is in the Recycle Bin."""
category = "crash_reports"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "Microsoft/Windows/WER/ReportArchive"

[rule.constraints]
min_age_days = 7
max_depth = 4
remove_empty_dirs = true

[[rule]]
id = "user-wer-queue"
title = "Error reports waiting to be sent"
description = """
Reports that Windows Error Reporting collected after a program failed and has not sent yet. Removing one only \
means that report is never sent to Microsoft; the program and Windows are not affected. Reports newer than 7 \
days are kept. You will not notice anything."""
category = "crash_reports"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "Microsoft/Windows/WER/ReportQueue"

[rule.constraints]
min_age_days = 7
max_depth = 4
remove_empty_dirs = true

[[rule]]
id = "user-crash-dumps"
title = "Application crash dumps"
description = """
Memory snapshots (.dmp files) that Windows writes into your profile when a program crashes and crash dumps \
are enabled for it. They are only useful to someone debugging that crash, for example a developer with a \
debugger. Dumps newer than 7 days are kept. You will not notice anything; a dump you still needed would be in \
the Recycle Bin."""
category = "crash_reports"
risk = "safe"
include = ["**/*.dmp"]

[rule.root]
location = "local_app_data"
path = "CrashDumps"

[rule.constraints]
min_age_days = 7
max_depth = 2

[[rule]]
id = "thumbnail-cache"
title = "Thumbnail cache"
description = """
The small preview pictures File Explorer keeps (thumbcache_*.db) so folders full of photos and videos open \
quickly. Windows rebuilds them whenever a folder is shown, so this is safe. Afterwards the first visit to a \
picture folder is a little slower while thumbnails are made again. File Explorer keeps some of these files \
open while it runs, and those are skipped and reported as in use; closing File Explorer windows first lets \
more of them go."""
category = "application_cache"
risk = "safe"
include = ["thumbcache_*.db"]

[rule.root]
location = "local_app_data"
path = "Microsoft/Windows/Explorer"

[rule.constraints]
min_age_days = 0
max_depth = 0

[[rule]]
id = "icon-cache"
title = "Icon cache"
description = """
The cache of program and file icons File Explorer keeps (iconcache_*.db) so the desktop and folders draw \
quickly. Windows rebuilds it by itself. Afterwards icons may flash or appear a moment late the first time \
they are shown. File Explorer keeps some of these files open while it runs, and those are skipped and \
reported as in use."""
category = "application_cache"
risk = "safe"
include = ["iconcache_*.db"]

[rule.root]
location = "local_app_data"
path = "Microsoft/Windows/Explorer"

[rule.constraints]
min_age_days = 0
max_depth = 0

# ---- browser caches ----------------------------------------------------------------------------
#
# The profile folder of a browser also holds cookies, history, saved logins, bookmarks, sessions,
# extensions and local storage. A rule here therefore names the cache folders it takes in `include`
# (`*` stands for the profile folder, "Default", "Profile 1" and so on, one level below the root) and
# never a whole profile. The `exclude` list keeps the walk out of the folders that hold the user's
# own data, as a second guard. A browser keeps the files of its cache open while it runs: those
# files are skipped, and a scan says so when the browser is running (`locked_by`).
#
# The Chromium rules also take the GPU caches that sit beside the profile folders (GrShaderCache,
# GraphiteDawnCache, ShaderCache: directly in "User Data") and the per-profile Dawn caches. All of
# these were checked read-only on a machine with Chrome and Edge; Vivaldi shares the Chromium layout
# (its user data folder is documented) but was not installed there. Left out on purpose: Service
# Worker storage (CacheStorage, ScriptCache: it is site data, offline pages included), the crx
# caches of extensions and components, and Opera (its cache and profile folders could not be
# verified, so no rule guesses at them).

[[rule]]
id = "chrome-cache"
title = "Chrome cache"
description = """
Copies of web pages, pictures and scripts that Chrome saved in each of its profiles so that sites load faster, plus the compiled code and graphics caches it builds from them. Only those cache folders are taken: cookies, history, saved passwords, bookmarks, open tabs, extensions and site data are never touched, so you stay signed in. Files modified in the last day are kept, and files Chrome has open while it runs are skipped. Sites load a little slower the first time afterwards while the cache fills again."""
category = "browser_cache"
risk = "safe"
include = [
    "*/Cache/**",
    "*/Code Cache/**",
    "*/GPUCache/**",
    "*/DawnCache/**",
    "*/DawnGraphiteCache/**",
    "*/DawnWebGPUCache/**",
    "GrShaderCache/**",
    "GraphiteDawnCache/**",
    "ShaderCache/**",
]
exclude = [
    "*/Extensions",
    "*/IndexedDB",
    "*/Local Storage",
    "*/Network",
    "*/Service Worker",
    "*/Sessions",
    "*/Storage",
]
locked_by = ["chrome.exe"]

[rule.root]
location = "local_app_data"
path = "Google/Chrome/User Data"

[rule.constraints]
min_age_days = 1
max_depth = 4

[[rule]]
id = "edge-cache"
title = "Edge cache"
description = """
Copies of web pages, pictures and scripts that Edge saved in each of its profiles so that sites load faster, plus the compiled code and graphics caches it builds from them. Only those cache folders are taken: cookies, history, saved passwords, bookmarks, open tabs, extensions and site data are never touched, so you stay signed in. Files modified in the last day are kept, and files Edge has open while it runs are skipped. Sites load a little slower the first time afterwards while the cache fills again."""
category = "browser_cache"
risk = "safe"
include = [
    "*/Cache/**",
    "*/Code Cache/**",
    "*/GPUCache/**",
    "*/DawnCache/**",
    "*/DawnGraphiteCache/**",
    "*/DawnWebGPUCache/**",
    "GrShaderCache/**",
    "GraphiteDawnCache/**",
    "ShaderCache/**",
]
exclude = [
    "*/Extensions",
    "*/IndexedDB",
    "*/Local Storage",
    "*/Network",
    "*/Service Worker",
    "*/Sessions",
    "*/Storage",
]
locked_by = ["msedge.exe"]

[rule.root]
location = "local_app_data"
path = "Microsoft/Edge/User Data"

[rule.constraints]
min_age_days = 1
max_depth = 4

[[rule]]
id = "brave-cache"
title = "Brave cache"
description = """
Copies of web pages, pictures and scripts that Brave saved in each of its profiles so that sites load faster, plus the compiled code and graphics caches it builds from them. Only those cache folders are taken: cookies, history, saved passwords, bookmarks, open tabs, extensions and site data are never touched, so you stay signed in. Files modified in the last day are kept, and files Brave has open while it runs are skipped. Sites load a little slower the first time afterwards while the cache fills again."""
category = "browser_cache"
risk = "safe"
include = [
    "*/Cache/**",
