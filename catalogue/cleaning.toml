[[rule]]
id = "firefox-cache"
title = "Firefox cache"
description = """
Copies of web pages, pictures and scripts that Firefox saved in the cache folder of each of its profiles so that sites load faster. Only the cache folder (cache2) is taken: cookies, history, saved logins, bookmarks, open tabs, extensions and site data live elsewhere and are never touched, so you stay signed in. Files modified in the last day are kept, and files Firefox has open while it runs are skipped. Sites load a little slower the first time afterwards while the cache fills again."""
category = "browser_cache"
risk = "safe"
include = ["*/cache2/**"]
exclude = ["*/storage", "*/extensions", "*/sessionstore-backups"]
locked_by = ["firefox.exe"]

[rule.root]
location = "local_app_data"
path = "Mozilla/Firefox/Profiles"

[rule.constraints]
min_age_days = 1
max_depth = 4

# ---- shader caches -----------------------------------------------------------------------------
#
# Compiled shaders that Windows and the graphics drivers keep so games and apps do not compile them
# again on every start. They are rebuilt on demand, but the first run of a game afterwards stutters
# while its shaders compile again, so they are unticked by default. Files newer than a day (a game
# that is running right now) are kept. Left out: the per-driver cache under LocalLow\NVIDIA (a rule
# root cannot name the LocalLow folder) and the Vulkan cache of AMD (VkCache).

[[rule]]
id = "directx-shader-cache"
title = "DirectX shader cache"
description = """
Compiled graphics shaders that DirectX saves in D3DSCache (one folder per program) so games and apps start \
without compiling them again. Windows and the programs rebuild them as they need them. Afterwards the first \
run of each game or app may stutter or load a little slower while its shaders compile again. Files modified \
in the last day are kept."""
category = "shader_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "D3DSCache"

[rule.constraints]
min_age_days = 1
max_depth = 3

[[rule]]
id = "nvidia-shader-cache"
title = "NVIDIA shader cache"
description = """
Compiled shaders that the NVIDIA driver keeps for DirectX (DXCache) and OpenGL (GLCache). The driver builds \
them again when a game or app asks for them. Afterwards the first run of each game may stutter or load \
slowly while shaders compile again. Other NVIDIA folders (OptiX, the NVIDIA app) are not touched. Files \
modified in the last day are kept."""
category = "shader_cache"
risk = "safe"
include = ["DXCache/**", "GLCache/**"]

[rule.root]
location = "local_app_data"
path = "NVIDIA"

[rule.constraints]
min_age_days = 1
max_depth = 3

[[rule]]
id = "nvidia-compute-cache"
title = "NVIDIA compute cache"
description = """
The per-user compute cache (ComputeCache) of the NVIDIA driver: GPU code that CUDA and similar programs \
compiled and saved. The driver compiles it again when a program needs it, so the first run of an AI or \
rendering program afterwards can start slowly. Files modified in the last day are kept."""
category = "shader_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "roaming_app_data"
path = "NVIDIA/ComputeCache"

[rule.constraints]
min_age_days = 1
max_depth = 3

[[rule]]
id = "amd-shader-cache"
title = "AMD shader cache"
description = """
Compiled shaders that the AMD driver keeps for DirectX 9/11 (DxCache), DirectX 12 (DxcCache) and OpenGL \
(GLCache). The driver builds them again when a game or app asks for them. Afterwards the first run of each \
game may stutter or load slowly while shaders compile again. Other AMD folders (settings, Vulkan cache) are \
not touched. Files modified in the last day are kept."""
category = "shader_cache"
risk = "safe"
include = ["DxCache/**", "DxcCache/**", "GLCache/**"]

[rule.root]
location = "local_app_data"
path = "AMD"

[rule.constraints]
min_age_days = 1
max_depth = 3

# ---- chat app caches ---------------------------------------------------------------------------
#
# A chat app rule takes the cache folders of the app and nothing else: never messages, databases,
# files received or saved (Zalo's "media", Telegram downloads), login or session state (cookies,
# local storage, tdata account folders). Each rule names the folders it takes in `include` and
# keeps the walk out of the user's own data with `exclude` as a second guard. Chromium based apps
# (Discord, Zalo, Teams) use the same cache folder names as the browsers above. A running app keeps
# some cache files open: those are skipped, and the scan names the app when it runs (`locked_by`).
# Unticked by default: afterwards the app downloads pictures, avatars and other media again.
#
# Layouts: Discord and Zalo were checked (folder names only) on a machine that has them. Telegram
# Desktop (tdata/user_data*/cache and media_cache, the folders its own "Clear cache" empties) and
# Teams (the WebView2 profile EBWebView of new Teams, the Cache folders of classic Teams) come
# from the apps' documentation; when a folder is not there the rule finds nothing.

[[rule]]
id = "discord-cache"
title = "Discord cache"
description = """
Pictures, avatars, scripts and graphics caches that Discord saved in its profile folder so chats open quickly. \
Only those cache folders are taken: messages live on Discord's servers, and your login, settings, local storage \
and cookies are never touched, so you stay signed in. Afterwards Discord downloads avatars and images again \
as you scroll, so chats load slower at first. Files modified in the last day are kept, and files Discord has \
open while it runs are skipped."""
category = "chat_app_cache"
risk = "safe"
include = [
    "Cache/**",
    "Code Cache/**",
    "GPUCache/**",
    "DawnGraphiteCache/**",
    "DawnWebGPUCache/**",
    "ShaderCache/**",
    "GPUPersistentCache/**",
]
exclude = [
    "IndexedDB",
    "Local Storage",
    "Network",
    "Service Worker",
    "Session Storage",
    "Shared Dictionary",
    "WebStorage",
]
locked_by = ["discord.exe"]

[rule.root]
location = "roaming_app_data"
path = "discord"

[rule.constraints]
min_age_days = 1
max_depth = 4

[[rule]]
id = "telegram-cache"
title = "Telegram Desktop cache"
description = """
The cache that Telegram Desktop keeps of pictures, stickers, voice messages and videos it downloaded for your \
chats (the cache and media_cache folders of each account). Your chats stay in your Telegram cloud, and your \
login (tdata), settings and the files you saved to your Downloads folder are never touched. Afterwards \
Telegram downloads the media of a chat again when you open it, which uses data and is slower at first. Files \
modified in the last day are kept, and files Telegram has open while it runs are skipped."""
category = "chat_app_cache"
risk = "safe"
include = ["tdata/user_data*/cache/**", "tdata/user_data*/media_cache/**"]
exclude = ["tdata/????????????????", "tdata/key_data*"]
locked_by = ["telegram.exe"]

[rule.root]
location = "roaming_app_data"
path = "Telegram Desktop"

[rule.constraints]
min_age_days = 1
max_depth = 5

[[rule]]
id = "teams-cache"
title = "Microsoft Teams cache (new Teams)"
description = """
The web cache that the new Microsoft Teams keeps in its WebView2 profile (Cache, Code Cache and GPUCache) so \
meetings and chats load quickly. Messages and files live in Microsoft 365, and your login, cookies and local \
storage are never touched. Afterwards Teams downloads images and its own scripts again, so it opens slower \
the first time. Files modified in the last day are kept, and files Teams has open while it runs are skipped."""
category = "chat_app_cache"
risk = "safe"
include = ["EBWebView/*/Cache/**", "EBWebView/*/Code Cache/**", "EBWebView/*/GPUCache/**"]
exclude = [
    "EBWebView/*/IndexedDB",
    "EBWebView/*/Local Storage",
    "EBWebView/*/Network",
    "EBWebView/*/Service Worker",
    "EBWebView/*/Session Storage",
]
locked_by = ["ms-teams.exe", "msteams.exe"]

[rule.root]
location = "local_app_data"
path = "Packages/MSTeams_8wekyb3d8bbwe/LocalCache/Microsoft/MSTeams"

[rule.constraints]
min_age_days = 1
max_depth = 5

[[rule]]
id = "teams-classic-cache"
title = "Microsoft Teams cache (classic Teams)"
description = """
The web cache of classic Microsoft Teams (Cache, Code Cache and GPUCache). Messages and files live in \
Microsoft 365, and your login, cookies, local storage and databases are never touched. Afterwards Teams \
downloads images and its own scripts again, so it opens slower the first time. Files modified in the last day \
are kept, and files Teams has open while it runs are skipped."""
category = "chat_app_cache"
risk = "safe"
include = ["Cache/**", "Code Cache/**", "GPUCache/**"]
exclude = ["databases", "IndexedDB", "Local Storage", "Network", "Session Storage", "blob_storage"]
locked_by = ["teams.exe"]

[rule.root]
location = "roaming_app_data"
path = "Microsoft/Teams"

[rule.constraints]
min_age_days = 1
max_depth = 4

[[rule]]
id = "zalo-cache"
title = "Zalo cache"
description = """
The web and graphics caches of Zalo for PC (Cache, Code Cache, GPUCache and DawnCache in the ZaloData folder). \
Your messages (Database), the pictures, videos and files received or sent (media), your login and settings are \
never touched. Afterwards Zalo loads avatars, stickers and images again, so chats open slower the first time. \
Files modified in the last day are kept, and files Zalo has open while it runs are skipped."""
category = "chat_app_cache"
risk = "safe"
include = ["Cache/**", "Code Cache/**", "GPUCache/**", "DawnCache/**"]
exclude = [
    "Database",
    "media",
    "Partitions",
    "Local Storage",
    "Network",
    "Session Storage",
    "pin-vault-data",
    "blob_storage",
]
locked_by = ["zalo.exe"]

[rule.root]
location = "roaming_app_data"
path = "ZaloData"

[rule.constraints]
min_age_days = 1
max_depth = 4

# ---- machine-wide: administrator rights needed --------------------------------------------------

[[rule]]
id = "windows-temp"
title = "Windows temporary files"
description = """
Files that Windows, services and installers running for all users left in C:\\Windows\\Temp. Only files and \
folders not modified for at least the minimum age are taken (7 days unless you change it in the settings), and \
the folder Windows uses to service updates (CBS) is never touched. Files in use are skipped. You will not \
notice anything: they are created again when needed. Reading and changing this folder needs administrator \
rights."""
category = "temporary_files"
risk = "caution"
include = ["**"]
exclude = ["CBS"]
requires_admin = true
min_age_setting = "clean.temp_min_age_days"

[rule.root]
location = "windows"
path = "Temp"

[rule.constraints]
min_age_days = 7
max_depth = 6
remove_empty_dirs = true

[[rule]]
id = "machine-wer-archive"
title = "Error reports already handled (all users)"
description = """
The machine-wide copy of the error reports Windows Error Reporting has dealt with, for every user and for \
services. Only useful for diagnosis; reports newer than 7 days are kept. You will not notice anything. Needs \
administrator rights."""
category = "crash_reports"
risk = "safe"
include = ["**"]
requires_admin = true

[rule.root]
location = "program_data"
path = "Microsoft/Windows/WER/ReportArchive"

[rule.constraints]
min_age_days = 7
max_depth = 4
remove_empty_dirs = true

[[rule]]
id = "machine-wer-queue"
title = "Error reports waiting to be sent (all users)"
description = """
The machine-wide queue of error reports that have not been sent yet. Removing one only means that report is \
never sent; Windows and the programs are not affected. Reports newer than 7 days are kept. You will not notice \
anything. Needs administrator rights."""
category = "crash_reports"
risk = "safe"
include = ["**"]
requires_admin = true

[rule.root]
location = "program_data"
path = "Microsoft/Windows/WER/ReportQueue"

[rule.constraints]
min_age_days = 7
max_depth = 4
remove_empty_dirs = true

[[rule]]
id = "windows-update-logs"
title = "Windows Update trace logs"
description = """
The trace logs (.etl files) the Windows Update client writes to C:\\Windows\\Logs\\WindowsUpdate. They only \
help someone diagnosing an update problem, and Windows writes new ones when it needs them. Logs newer than 7 \
days are kept, so a problem you are chasing right now stays documented. You will not notice anything. Needs \
administrator rights."""
category = "logs"
risk = "safe"
include = ["*.etl"]
requires_admin = true

[rule.root]
location = "windows"
path = "Logs/WindowsUpdate"

[rule.constraints]
min_age_days = 7
max_depth = 0

[[rule]]
id = "delivery-optimization-cache"
title = "Delivery Optimization cache"
description = """
Update files that the Delivery Optimization service downloaded and keeps so it can share them with other PCs \
and finish interrupted downloads. Windows downloads them again if they are needed. Files newer than 7 days are \
kept, so a download in progress is not disturbed. You will not notice anything, except that an update that was \
waiting may download again. Marked Caution because the service owns this folder and Windows' own cleanup uses \
the service rather than deleting the files; a file the service holds open is skipped. Needs administrator \
rights."""
category = "windows_update"
risk = "caution"
include = ["**"]
requires_admin = true

[rule.root]
location = "windows"
path = "ServiceProfiles/NetworkService/AppData/Local/Microsoft/Windows/DeliveryOptimization/Cache"

[rule.constraints]
min_age_days = 7
max_depth = 4

# ---- developer tool caches -------------------------------------------------------------------
#
# Only the DEFAULT locations are covered: a cache moved with CARGO_HOME, `npm config set cache`,
# PIP_CACHE_DIR, a pnpm `store-dir`, NUGET_PACKAGES, GRADLE_USER_HOME or YARN_CACHE_FOLDER is not
# followed. A tool that is not installed has no folder, which is nothing to clean and no error.
# The tools' own clean commands are not used: they can neither be previewed nor go to the Recycle Bin.

[[rule]]
id = "npm-cache"
title = "npm download cache"
description = """
The package cache npm keeps in its default location (%LOCALAPPDATA%\\npm-cache\\_cacache), so installs can reuse \
downloads. Afterwards the next npm install downloads the packages it needs again, which is slower and uses \
data, but nothing is lost: it is only a copy of what the registry serves. Moved caches (npm config) are not \
followed. Files modified in the last day are kept."""
category = "developer_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "npm-cache/_cacache"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "pnpm-store"
title = "pnpm package store"
description = """
The content-addressed store pnpm keeps in its default location (%LOCALAPPDATA%\\pnpm\\store) and links into \
your projects. Projects that are already installed keep working, because their node_modules hold their own \
links to the files. Afterwards the next pnpm install downloads every package it needs again, which can take a \
long time for many projects. Marked Caution for that reason. A store on another drive (.pnpm-store) or a moved \
store-dir is not followed. Files modified in the last day are kept."""
category = "developer_cache"
risk = "caution"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "pnpm/store"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "pnpm-metadata-cache"
title = "pnpm metadata cache"
description = """
The package metadata pnpm caches in %LOCALAPPDATA%\\pnpm-cache so it can resolve versions without asking the \
registry each time. Afterwards the next pnpm install fetches that metadata again, which is a little slower \
once. Nothing else is lost. A moved cache directory is not followed. Files modified in the last day are kept."""
category = "developer_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "pnpm-cache"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "pip-cache"
title = "pip download cache"
description = """
The wheels and HTTP responses pip caches in %LOCALAPPDATA%\\pip\\Cache. Packages you have installed stay \
installed. Afterwards the next pip install downloads (or builds again) the packages it needs, which can be \
slow for large ones such as PyTorch. A cache moved with PIP_CACHE_DIR or pip config is not followed. Files \
modified in the last day are kept."""
category = "developer_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "pip/Cache"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "cargo-cache"
title = "Cargo registry cache and git checkouts"
description = """
The downloaded crate archives (registry\\cache), their unpacked sources (registry\\src) and the git checkouts \
(git\\checkouts) that Cargo keeps in %USERPROFILE%\\.cargo. The registry index, git databases, installed \
programs (bin) and credentials are never touched. Afterwards the next cargo build downloads and unpacks the \
crates it needs again, and clones git dependencies again, which needs a network connection and can take a \
while for big projects. Marked Caution for that reason. A CARGO_HOME elsewhere is not followed. Files \
modified in the last day are kept."""
category = "developer_cache"
risk = "caution"
include = ["registry/cache/**", "registry/src/**", "git/checkouts/**"]

[rule.root]
location = "user_profile"
path = ".cargo"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "nuget-http-cache"
title = "NuGet HTTP cache"
description = """
The web responses NuGet caches in %LOCALAPPDATA%\\NuGet\\v3-cache (package lists and downloads in progress). \
Afterwards NuGet asks the feeds again, which is a little slower once. Installed packages are not touched. \
Files modified in the last day are kept."""
category = "developer_cache"
risk = "safe"
include = ["**"]

[rule.root]
location = "local_app_data"
path = "NuGet/v3-cache"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "nuget-packages"
title = "NuGet global packages"
description = """
The packages every .NET project restores into %USERPROFILE%\\.nuget\\packages. Afterwards the next restore or \
build downloads every package it needs again, which needs a network connection and can take long for large \
solutions; a project that must build offline cannot until then. Marked Caution for that reason. A folder set \
with NUGET_PACKAGES or a nuget.config is not followed. Files modified in the last day are kept."""
category = "developer_cache"
risk = "caution"
include = ["**"]

[rule.root]
location = "user_profile"
path = ".nuget/packages"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "gradle-caches"
title = "Gradle caches"
description = """
The downloaded dependencies, transformed jars and build cache Gradle keeps in %USERPROFILE%\\.gradle\\caches. \
Settings (gradle.properties, init scripts) and the downloaded Gradle versions (wrapper) are never touched. \
Afterwards the next Gradle build downloads every dependency again and rebuilds what the build cache held, \
which can take a long time for Android or large JVM projects. Marked Caution for that reason. A \
GRADLE_USER_HOME elsewhere is not followed. Files modified in the last day are kept."""
category = "developer_cache"
risk = "caution"
include = ["**"]

[rule.root]
location = "user_profile"
path = ".gradle/caches"

[rule.constraints]
min_age_days = 1
max_depth = 16

[[rule]]
id = "yarn-cache"
title = "Yarn cache"
description = """
The package cache of Yarn Classic (%LOCALAPPDATA%\\Yarn\\Cache) and the global cache of Yarn Berry \
(%LOCALAPPDATA%\\Yarn\\Berry\\cache). Afterwards the next yarn install downloads the packages it needs again, \
which is slower and uses data. A cache moved with YARN_CACHE_FOLDER or .yarnrc is not followed, and a \
project-local .yarn\\cache is never touched. Files modified in the last day are kept."""
category = "developer_cache"
risk = "safe"
include = ["Cache/**", "Berry/cache/**"]

[rule.root]
location = "local_app_data"
path = "Yarn"

[rule.constraints]
min_age_days = 1
max_depth = 16
