[package]
name = "volt-win"
description = "Windows adapters for the volt-core ports. The only crate that may contain unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Measurements and launch calls for the CI job that runs the real helper on a hosted runner. Never
# enabled by a product build (see `helper::ci`).
elevated-ci = []

[dependencies]
volt-core.workspace = true
log.workspace = true
windows = { workspace = true, features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Restore",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
volt-core = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
