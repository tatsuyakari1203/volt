[package]
name = "volt-win"
description = "Windows adapters for the volt-core ports. The only crate that may contain unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
volt-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Shell",
] }

[dev-dependencies]
volt-core = { workspace = true, features = ["fakes"] }
