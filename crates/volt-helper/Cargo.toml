[package]
name = "volt-helper"
description = "The elevated helper: a small administrator process that serves one UI over a private pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "volt_helper"
path = "src/lib.rs"

[[bin]]
name = "volt-helper"
path = "src/main.rs"

# The harness of the elevated CI job (see ci/elevated_ci.rs). Never built by the release workflow,
# never bundled, not part of `pnpm check`.
[[bin]]
name = "volt-elevated-ci"
path = "ci/elevated_ci.rs"
required-features = ["elevated-ci"]

[features]
elevated-ci = ["volt-win/elevated-ci"]

[dependencies]
volt-core.workspace = true
volt-store.workspace = true
volt-win.workspace = true
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
volt-core = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
