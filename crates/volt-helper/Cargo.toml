[package]
name = "volt-helper"
description = "The elevated helper: a small administrator process that serves one UI over a private pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "volt_helper"
path = "src/lib.rs"

[[bin]]
name = "volt-helper"
path = "src/main.rs"

[dependencies]
volt-core.workspace = true
volt-win.workspace = true

[dev-dependencies]
volt-core = { workspace = true, features = ["fakes"] }
