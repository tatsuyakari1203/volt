# The test-only tweaks of the elevated CI harness. They are appended to the embedded catalogue ONLY in
# the harness build (the `elevated-ci` feature), never in a product helper. They change one value
# under throwaway keys of a hosted runner's registry.
[[tweak]]
id = "ci-voltest-marker"
title = "CI marker"
description = "Sets a marker value under a throwaway key. Exists only in the CI harness build."
category = "privacy"
risk = "safe"
evidence = "measured"
evidence_note = "Test-only."
requires_admin = true

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SOFTWARE\VoltTest\Ci'
name = "Marker"
value = { dword = 1 }

# Its key is made by the workflow so that Users can write to it. The helper must refuse the write.
[[tweak]]
id = "ci-voltest-open"
title = "CI open key"
description = "Sets a marker value under a key that Users can write to. The helper must refuse it."
category = "privacy"
risk = "safe"
evidence = "measured"
evidence_note = "Test-only."
requires_admin = true

[[tweak.steps]]
kind = "registry_set"
hive = "HKLM"
subkey = 'SOFTWARE\VoltTest\Open'
name = "Marker"
value = { dword = 1 }
