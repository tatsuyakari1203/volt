[package]
name = "volt-desktop"
description = "Volt desktop shell: Tauri host, commands and window lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "volt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
# Shell plugins, pinned exactly. Driven from Rust only: the UI gets no plugin permission.
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-autostart = "=2.5.1"
# Native save dialog for the activity export. Driven from Rust only: no capability grants the
# dialog, fs or any other plugin command to the UI. Newer 2.8.x needs tauri 2.12 and Rust 1.90.
tauri-plugin-dialog = "=2.7.3"
# Desktop notification when a tray Boost finishes with no window. Driven from Rust only: no
# capability grants it to the UI, and on Windows it calls the local toast API (no network).
tauri-plugin-notification = "=2.4.0"
serde = { version = "1", features = ["derive"] }
# Reads the phrase table the tray and Boost notification write in.
serde_json = { workspace = true }
# Typed IPC: pinned exactly because tauri-specta is still a release candidate. The three move
# together (tauri-specta requires the matching specta rc and specta-typescript 0.0.13).
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
volt-core = { workspace = true }
volt-store = { workspace = true }
volt-win = { workspace = true }
log = { workspace = true }

[dev-dependencies]
volt-core = { workspace = true, features = ["fakes"] }
tempfile = { workspace = true }
