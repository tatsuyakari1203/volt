[workspace]
resolver = "3"
# Every member must have an entry in scripts/check-arch.mjs.
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["tatsuyakari1203"]
repository = "https://github.com/tatsuyakari1203/volt"
publish = false

[workspace.dependencies]
volt-core = { path = "crates/volt-core" }
volt-store = { path = "crates/volt-store" }
volt-win = { path = "crates/volt-win" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Dev-only: round-trip tests for the persisted and IPC data types.
serde_json = "1"

[workspace.lints.rust]
# volt-win is the only crate allowed to opt back in (see its lib.rs).
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
