name: Elevated helper

# Runs the RELEASE helper (volt-helper.exe) for real on a GitHub-hosted Windows runner, which is a
# throwaway virtual machine whose user holds an administrator token: starting the helper there
# shows no prompt and harms nobody. Nothing else in the repository starts the helper, writes under
# Program Files or purges memory in a test; the harness refuses to run anywhere but here.
#
# Two jobs. "Elevated helper" stages a folder by hand and runs the harness as the UI, in two
# phases: against the RELEASE helper (the state folder it makes, the single-helper lock, a tweak
# request that nobody can confirm), then, after a check that the release helper holds nothing of the
# harness, against a HARNESS-feature build of the helper whose confirmer accepts (an apply and a
# revert of a test-only tweak under a throwaway HKLM key, and machine-wide cleaning: scan and apply
# against throwaway trees under ProgramData\VoltTest, the race cases on real NTFS including a real
# volume mount point, and a counts-only scan of the runner's own Windows Temp). "Installer" builds the real installer,
# installs it on the runner (all users, then just this user), checks what it left behind and
# removes it again.
#
# Limited by paths to the code the helper and the installer are made of, so unrelated changes do
# not wait for it. It is not a required status check.
on:
  push:
    branches: [main]
    paths:
      - crates/volt-core/**
      - crates/volt-store/**
      - crates/volt-win/**
      - crates/volt-helper/**
      - catalogue/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/build-helper.ps1
      - scripts/check-helper-harness.ps1
      - scripts/build-installer.ps1
      - scripts/installer-checks.ps1
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.helper.conf.json
      - apps/desktop/src-tauri/installer-hooks.nsh
      - .github/workflows/elevated-helper.yml
  pull_request:
    paths:
      - crates/volt-core/**
      - crates/volt-store/**
      - crates/volt-win/**
      - crates/volt-helper/**
      - catalogue/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/build-helper.ps1
      - scripts/check-helper-harness.ps1
      - scripts/build-installer.ps1
      - scripts/installer-checks.ps1
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.helper.conf.json
      - apps/desktop/src-tauri/installer-hooks.nsh
      - .github/workflows/elevated-helper.yml

concurrency:
  group: elevated-helper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  elevated-helper:
    name: Elevated helper
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner context is not available in `env:` above, so the folder is set here.
      - name: Choose the report folder
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'volt-elevated-ci'
          "REPORT_DIR=$dir" | Add-Content -Path $env:GITHUB_ENV

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the release helper
        run: pwsh scripts/build-helper.ps1

      # The accepting confirmer and the test tweak exist only in the harness build. The release
      # helper must hold none of their strings; the same search on the harness build (below) must
      # find them, which is what shows the search works.
      - name: Check that the release helper holds nothing of the harness
        run: pwsh scripts/check-helper-harness.ps1 -Binary target/helper/release/volt-helper.exe -Expect absent

      # The harness is a binary behind a non-default feature: the release workflow and the
      # installer never build it.
      - name: Build and lint the harness
        run: |
          cargo clippy -p volt-helper --features elevated-ci --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p volt-helper --features elevated-ci --bin volt-elevated-ci --locked

      # Reads only: the measurement code on this process, and the harness's refusal to run unless
      # every switch of this workflow is set.
      - name: Test the harness support code
        run: |
          cargo test -p volt-win --features elevated-ci --lib --locked helper::ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p volt-helper --features elevated-ci --bin volt-elevated-ci --locked

      # The folder is created by an administrator under Program Files, so it carries the inherited
      # ACL of Program Files, exactly what the installer leaves. The harness plays the UI, so it
      # takes the UI executable's name.
      - name: Stage the install folder
        run: |
          $dir = Join-Path $env:ProgramFiles 'Volt'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/helper/release/volt-helper.exe (Join-Path $dir 'volt-helper.exe')
          Copy-Item target/debug/volt-elevated-ci.exe (Join-Path $dir 'volt-desktop.exe')
          New-Item -ItemType Directory -Path $env:REPORT_DIR -Force | Out-Null
          $diag = @()
          $diag += '--- whoami /groups (integrity level)'
          $diag += (whoami /groups | Select-String 'Mandatory Label|BUILTIN\Administrators')
          $diag += '--- EnableLUA'
          $diag += (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA
          $diag += '--- icacls of the install folder and the helper'
          $diag += (icacls $dir)
          $diag += (icacls (Join-Path $dir 'volt-helper.exe'))
          $diag | Tee-Object -FilePath (Join-Path $env:REPORT_DIR 'staging.txt')

      - name: Run the helper for real
        env:
          VOLT_ELEVATED_CI: "1"
        run: |
          $exe = Join-Path $env:ProgramFiles 'Volt\volt-desktop.exe'
          & $exe run --out $env:REPORT_DIR 2>&1 | Tee-Object -FilePath (Join-Path $env:REPORT_DIR 'harness.log')
          exit $LASTEXITCODE

      # The harness build of the helper, with the accepting confirmer and the test tweak. It
      # replaces the release helper in the staged folder only now that the release helper's own
      # cases are done.
      - name: Build the harness helper
        run: |
          cargo build -p volt-helper --features elevated-ci --bin volt-helper --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh scripts/check-helper-harness.ps1 -Binary target/debug/volt-helper.exe -Expect present

      - name: Run the helper's tweak engine and machine cleaning for real
        env:
          VOLT_ELEVATED_CI: "1"
        run: |
          Copy-Item target/debug/volt-helper.exe (Join-Path $env:ProgramFiles 'Volt\volt-helper.exe') -Force
          # A throwaway key that Users can write to: a tweak that writes through it must be refused.
          $open = 'HKLM:\SOFTWARE\VoltTest\Open'
          New-Item $open -Force | Out-Null
          $acl = Get-Acl $open
          $acl.AddAccessRule((New-Object System.Security.AccessControl.RegistryAccessRule('BUILTIN\Users', 'SetValue', 'Allow')))
          Set-Acl $open $acl
          $exe = Join-Path $env:ProgramFiles 'Volt\volt-desktop.exe'
          & $exe tweaks --out $env:REPORT_DIR 2>&1 | Tee-Object -FilePath (Join-Path $env:REPORT_DIR 'harness-tweaks.log')
          exit $LASTEXITCODE

      - name: Job summary
        if: always()
        run: |
          foreach ($name in 'elevated-helper-report.md', 'elevated-helper-tweaks-report.md') {
            $report = Join-Path $env:REPORT_DIR $name
            if (Test-Path $report) { Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY }
            else { "The harness wrote no $name." | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: elevated-helper-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn

  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dev tools
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Choose the report folder
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'volt-installer-ci'
          "REPORT_DIR=$dir" | Add-Content -Path $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

      # The release helper and the installer, built the way the release workflow builds them.
      - name: Build the installer
        run: pwsh scripts/build-installer.ps1

      - name: Build the harness
        run: cargo build -p volt-helper --features elevated-ci --bin volt-elevated-ci --locked

      - name: Check the installer
        env:
          VOLT_ELEVATED_CI: "1"
        run: pwsh scripts/installer-checks.ps1 -ReportDir $env:REPORT_DIR

      - name: Job summary
        if: always()
        run: |
          foreach ($name in 'installer-checks.md', 'installed-report.md', 'per-user-report.md', 'per-user-with-helper-report.md') {
            $report = Join-Path $env:REPORT_DIR $name
            if (Test-Path $report) { Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installer-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
