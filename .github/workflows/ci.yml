name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CODEGRAPH_TELEMETRY: "0"

jobs:
  check:
    # Job names are required status checks on main: do not rename without updating branch protection.
    name: Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dev tools
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Also part of `pnpm check`; run first and by name so a privacy failure is easy to find.
      - name: Privacy guarantee (offline, no telemetry)
        run: pnpm check:privacy

      - name: Run all gates
        run: pnpm check

      # Dependabot writes "Bump x from a to b", which the subject-case rule rejects.
      - name: Lint PR title (it becomes the squash commit)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: $env:PR_TITLE | pnpm exec commitlint

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2

      - uses: crate-ci/typos@v1
