name: Feature or tweak request
description: Suggest a feature, a cleaning rule or a tweak
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (for tweaks and cleaning rules)
      description: >
        What exactly changes (registry keys, services, paths), how to revert it, and what shows
        that it helps (a measurement, official documentation). Requests without this may be closed.
